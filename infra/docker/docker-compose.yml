version: "3.9"

# AeroSwarm — Local Development Stack
# Runs: FastAPI backend, PostgreSQL, Redis, Traefik reverse proxy

services:
  # ─── Reverse Proxy ─────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.0
    container_name: aeroswarm-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"     # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - aeroswarm-net

  # ─── Database ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aeroswarm-postgres
    environment:
      POSTGRES_DB: aeroswarm
      POSTGRES_USER: aeroswarm
      POSTGRES_PASSWORD: aeroswarm_dev_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aeroswarm-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeroswarm"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Pub/Sub & Cache ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aeroswarm-redis
    ports:
      - "6379:6379"
    networks:
      - aeroswarm-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Backend API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: aeroswarm-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://aeroswarm:aeroswarm_dev_secret@postgres:5432/aeroswarm
      REDIS_URL: redis://redis:6379
      DOCKER_HOST: unix:///var/run/docker.sock
      REPO_BASE_PATH: /repos
      SECRET_KEY: change_me_in_production
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - repos_volume:/repos
      - ../../backend:/app  # hot-reload in dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aeroswarm-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.aeroswarm.localhost`)"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

volumes:
  postgres_data:
  repos_volume:

networks:
  aeroswarm-net:
    driver: bridge
