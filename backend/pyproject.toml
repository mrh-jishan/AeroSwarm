[tool.poetry]
name = "aeroswarm-backend"
version = "0.1.0"
description = "AeroSwarm FastAPI backend — orchestrates AI agents in isolated Docker containers"
authors = ["AeroSwarm Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"
alembic = "^1.13.0"
redis = {extras = ["asyncio"], version = "^5.0.0"}
docker = "^7.1.0"
gitpython = "^3.1.40"
langchain-openai = "^0.2.0"
langchain-core = "^0.3.0"
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
httpx = "^0.27.0"
websockets = "^12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
black = "^24.0.0"
ruff = "^0.5.0"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
markers = [
  "integration: tests that hit a live AeroSwarm backend and external integrations",
]
