[tool.poetry]
name = "aeroswarm-agent"
version = "0.1.0"
description = "AeroSwarm LangGraph worker agent — runs inside isolated Docker container"
authors = ["AeroSwarm Team"]
packages = [{include = "agent"}]

[tool.poetry.dependencies]
python = "^3.12"
langgraph = "^0.2.0"
langchain-openai = "^0.2.0"
langchain-core = "^0.3.0"
redis = {extras = ["asyncio"], version = "^5.0.0"}
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
